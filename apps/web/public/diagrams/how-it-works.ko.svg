      .m{font-family:"JetBrains Mono","IBM Plex Mono","IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",ui-monospace,SFMono-Regular,Consolas,monospace}
      .eyebrow{font-size:11px;font-weight:600;letter-spacing:.08em;fill:#0b6e6a}
      .title{font-size:28px;font-weight:600;fill:#0c1513;letter-spacing:-.01em}
      .sub{font-size:14px;fill:#566461}
      .stage{font-size:18px;font-weight:600;fill:#0c1513}
      .body{font-size:13px;fill:#263230}
      .foot{font-size:11px;fill:#566461}
      .chip{font-size:10px;font-weight:600;letter-spacing:.06em}
      .band{font-size:11px;font-weight:600;letter-spacing:.08em;fill:#566461}
      .ctx{font-size:11px;fill:#7d8b88}
      .rule{stroke:#d0d7de;stroke-width:1}
    </style>
  </defs>

  <rect width="1200" height="520" fill="#f7faf9"/>
  <rect width="1200" height="4" fill="#0b6e6a"/>
  <rect x=".5" y=".5" width="1199" height="519" fill="none" stroke="#d0d7de"/>

  <g class="s">
    <text class="eyebrow" x="40" y="48">계층 분리</text>
    <text class="title" x="40" y="84">AI가 제안하고, 사람이 승인하고, 코드가 판정합니다.</text>
    <text class="sub" x="40" y="112">점선 회색은 모델 출력이고, 신뢰하지 않습니다. 청록은 사람의 결정, 먹색은 버전이 고정된 코드입니다.</text>
    <text class="sub" x="40" y="132">한 계층이 권한을 둘 갖지 않습니다. 판정은 그것이 달고 있는 엔진 버전과 규칙 버전, 임계값 아래에서만 참입니다.</text>
  </g>
  <line class="rule" x1="40" y1="150" x2="1160" y2="150"/>

  <g class="s">
    <text class="ctx" x="40" y="176">들어오는 것 · 종목과 행위자 그룹, 시간 구간을 지목한 알림</text>
    <text class="ctx" x="1160" y="176" text-anchor="end">나가는 것 · 다음 검토자가 다시 도출할 수 있는 결과</text>
  </g>

  <!-- stage 1 -->
  <rect x="40" y="192" width="262" height="200" fill="#eef1f2" stroke="#4f6270" stroke-dasharray="4 3"/>
  <rect x="56" y="208" width="64" height="18" fill="#ffffff" stroke="#4f6270" stroke-dasharray="4 3"/>
  <text class="s chip" x="64" y="221" fill="#4f6270">AI가 제안</text>
  <g class="s">
    <text class="stage" x="56" y="256">L1 · 해석</text>
    <text class="body" x="56" y="284">제약된 매퍼가 소스 열마다 대상</text>
    <text class="body" x="56" y="304">필드 하나와 허용된 변환 하나를</text>
    <text class="body" x="56" y="324">확신도, 근거와 함께 제안합니다.</text>
  </g>
  <text class="m foot" x="56" y="374">mappingVersion 1.4</text>

  <!-- stage 2 -->
  <rect x="326" y="192" width="262" height="200" fill="#e6f2f1" stroke="#0b6e6a"/>
  <rect x="342" y="208" width="72" height="18" fill="#ffffff" stroke="#0b6e6a"/>
  <text class="s chip" x="350" y="221" fill="#0b6e6a">사람이 승인</text>
  <g class="s">
    <text class="stage" x="342" y="256">L2 · 승인</text>
    <text class="body" x="342" y="284">검토자가 그 제안을 해시에 묶어</text>
    <text class="body" x="342" y="304">그대로 승인합니다. 표시된 필드는</text>
    <text class="body" x="342" y="324">사유를 적어야 넘어갑니다.</text>
  </g>
  <text class="m foot" x="342" y="374">approvedArtifactHash</text>

  <!-- stage 3 -->
  <rect x="612" y="192" width="262" height="200" fill="#ffffff" stroke="#14211f"/>
  <rect x="628" y="208" width="72" height="18" fill="#f0f5f4" stroke="#14211f"/>
  <text class="s chip" x="636" y="221" fill="#14211f">코드가 판정</text>
  <g class="s">
    <text class="stage" x="628" y="256">L3 · 판정</text>
    <text class="body" x="628" y="284">버전이 고정된 코드가 정렬하고,</text>
    <text class="body" x="628" y="304">중복을 거르고, 소수를 정확히</text>
    <text class="body" x="628" y="324">계산해 RAPID_PRICE_LIFT 1.1을</text>
    <text class="body" x="628" y="344">평가합니다.</text>
  </g>
  <text class="m foot" x="628" y="374">engine 0.7.0-canonical-decimal</text>

  <!-- stage 4 -->
  <rect x="898" y="192" width="262" height="200" fill="#ffffff" stroke="#14211f"/>
  <rect x="914" y="208" width="72" height="18" fill="#f0f5f4" stroke="#14211f"/>
  <text class="s chip" x="922" y="221" fill="#14211f">코드가 기록</text>
  <g class="s">
    <text class="stage" x="914" y="256">L4 · 증거</text>
    <text class="body" x="914" y="284">결과에는 정본 해시와 다섯 gate의</text>
    <text class="body" x="914" y="304">발견, 그리고 원본 행까지 되짚는</text>
    <text class="body" x="914" y="324">이벤트 식별자가 담깁니다.</text>
  </g>
  <text class="m foot" x="914" y="374">eventId → rawRowHash</text>

  <g fill="#0b6e6a">
    <path d="M306 286l10 6-10 6z"/>
    <path d="M592 286l10 6-10 6z"/>
    <path d="M878 286l10 6-10 6z"/>
  </g>

  <line class="rule" x1="40" y1="422" x2="1160" y2="422"/>

  <g class="s">
    <text class="band" x="40" y="452">막힐 때는 닫히고, 결과로 나오지 않습니다</text>
    <text class="band" x="1160" y="452" text-anchor="end">결과는 이 셋뿐입니다</text>
  </g>
  <g>
    <rect x="40" y="464" width="160" height="20" fill="#eef1f2" stroke="#4f6270" stroke-dasharray="4 3"/>
    <text class="m chip" x="50" y="478" fill="#4f6270">INPUT_REVIEW_REQUIRED</text>
    <rect x="208" y="464" width="174" height="20" fill="#eef1f2" stroke="#4f6270" stroke-dasharray="4 3"/>
    <text class="m chip" x="218" y="478" fill="#4f6270">MAPPING_REVIEW_REQUIRED</text>
    <rect x="390" y="464" width="154" height="20" fill="#eef1f2" stroke="#4f6270" stroke-dasharray="4 3"/>
    <text class="m chip" x="400" y="478" fill="#4f6270">CASE_REVIEW_REQUIRED</text>
  </g>
  <g>
    <rect x="854" y="464" width="82" height="20" fill="#e6f2f1" stroke="#0b6e6a"/>
    <text class="m chip" x="864" y="478" fill="#0b6e6a">SUPPORTED</text>
    <rect x="944" y="464" width="108" height="20" fill="#f0f5f4" stroke="#263230"/>
    <text class="m chip" x="954" y="478" fill="#263230">NOT_SUPPORTED</text>
    <rect x="1060" y="464" width="100" height="20" fill="#fbf4e4" stroke="#8a6a12"/>
    <text class="m chip" x="1070" y="478" fill="#8a6a12">INCONCLUSIVE</text>
  </g>
</svg>
