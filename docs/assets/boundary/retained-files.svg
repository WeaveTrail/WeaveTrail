  <text class="eyebrow" x="24" y="26">WHAT EACH RETAINED FILE HOLDS AND HOW WRITES FAIL</text>

    <text><tspan class="l" x="24.0" y="46">page-N.response</tspan><tspan class="t" x="164.4" y="46">original</tspan><tspan class="t" x="234.6" y="46">entity</tspan><tspan class="t" x="289.2" y="46">bytes,</tspan><tspan class="t" x="343.8" y="46">no</tspan><tspan class="t" x="367.2" y="46">reserialization;</tspan><tspan class="t" x="499.8" y="46">the</tspan><tspan class="t" x="531.0" y="46">decoder</tspan><tspan class="t" x="593.4" y="46">receives</tspan><tspan class="t" x="663.6" y="46">a</tspan><tspan class="t" x="679.2" y="46">copy,</tspan></text>
    <text><tspan class="t" x="164.4" y="67">so</tspan><tspan class="t" x="187.8" y="67">adapter</tspan><tspan class="t" x="250.2" y="67">parsing</tspan><tspan class="t" x="312.6" y="67">cannot</tspan><tspan class="t" x="367.2" y="67">mutate</tspan><tspan class="t" x="421.8" y="67">the</tspan><tspan class="t" x="453.0" y="67">retained</tspan><tspan class="t" x="523.2" y="67">or</tspan><tspan class="t" x="546.6" y="67">hashed</tspan><tspan class="k" x="601.2" y="67">HTTP</tspan><tspan class="t" x="640.2" y="67">entity</tspan></text>
    <text><tspan class="l" x="24.0" y="88">source.jsonl</tspan><tspan class="t" x="164.4" y="88">every</tspan><tspan class="t" x="211.2" y="88">decoded</tspan><tspan class="t" x="273.6" y="88">item</tspan><tspan class="t" x="312.6" y="88">in</tspan><tspan class="t" x="336.0" y="88">page</tspan><tspan class="t" x="375.0" y="88">and</tspan><tspan class="t" x="406.2" y="88">item</tspan><tspan class="t" x="445.2" y="88">order,</tspan><tspan class="t" x="499.8" y="88">compact</tspan><tspan class="k" x="562.2" y="88">JSON.stringify</tspan><tspan class="t" x="679.2" y="88">per</tspan></text>
    <text><tspan class="t" x="164.4" y="109">item,</tspan><tspan class="t" x="211.2" y="109">LF</tspan><tspan class="t" x="234.6" y="109">separators,</tspan><tspan class="t" x="328.2" y="109">final</tspan><tspan class="t" x="375.0" y="109">LF</tspan><tspan class="t" x="398.4" y="109">for</tspan><tspan class="t" x="429.6" y="109">nonempty</tspan><tspan class="t" x="499.8" y="109">data;</tspan><tspan class="t" x="546.6" y="109">values</tspan><tspan class="t" x="601.2" y="109">and</tspan><tspan class="t" x="632.4" y="109">column</tspan></text>
    <text><tspan class="t" x="164.4" y="130">insertion</tspan><tspan class="t" x="242.4" y="130">order</tspan><tspan class="t" x="289.2" y="130">intact</tspan></text>
    <text><tspan class="l" x="24.0" y="151">rows.json</tspan><tspan class="t" x="164.4" y="151">adds</tspan><tspan class="t" x="203.4" y="151">only</tspan><tspan class="t" x="242.4" y="151">source</tspan><tspan class="t" x="297.0" y="151">coordinates:</tspan><tspan class="t" x="398.4" y="151">the</tspan><tspan class="t" x="429.6" y="151">source</tspan><tspan class="k" x="484.2" y="151">SHA-256</tspan><tspan class="t" x="546.6" y="151">and</tspan><tspan class="t" x="577.8" y="151">the</tspan><tspan class="t" x="609.0" y="151">one-based</tspan></text>
    <text><tspan class="t" x="164.4" y="172">physical</tspan><tspan class="t" x="234.6" y="172">line</tspan><tspan class="t" x="273.6" y="172">number;</tspan><tspan class="t" x="336.0" y="172">reproducible</tspan><tspan class="t" x="437.4" y="172">offline</tspan><tspan class="t" x="499.8" y="172">with</tspan></text>
    <text><tspan class="t" x="164.4" y="193">scripts/derive-published-rows.mjs</tspan></text>
    <text><tspan class="l" x="24.0" y="214">hashing</tspan><tspan class="t" x="164.4" y="214">ordinary</tspan><tspan class="k" x="234.6" y="214">SHA-256</tspan><tspan class="t" x="297.0" y="214">of</tspan><tspan class="k" x="320.4" y="214">UTF-8</tspan><tspan class="t" x="367.2" y="214">bytes;</tspan><tspan class="t" x="421.8" y="214">no</tspan><tspan class="t" x="445.2" y="214">financial</tspan><tspan class="t" x="523.2" y="214">arithmetic</tspan></text>
    <text><tspan class="l" x="24.0" y="235">memory</tspan><tspan class="t" x="164.4" y="235">the</tspan><tspan class="t" x="195.6" y="235">collector</tspan><tspan class="t" x="273.6" y="235">holds</tspan><tspan class="t" x="320.4" y="235">rows</tspan><tspan class="t" x="359.4" y="235">in</tspan><tspan class="t" x="382.8" y="235">memory;</tspan><tspan class="t" x="445.2" y="235">a</tspan><tspan class="t" x="460.8" y="235">storage</tspan><tspan class="t" x="523.2" y="235">or</tspan><tspan class="t" x="546.6" y="235">memory</tspan><tspan class="t" x="601.2" y="235">failure</tspan><tspan class="t" x="663.6" y="235">is</tspan><tspan class="t" x="687.0" y="235">an</tspan></text>
