    <text><tspan class="t" x="164.4" y="298">transport;</tspan><tspan class="t" x="250.2" y="298">a</tspan><tspan class="t" x="265.8" y="298">caught</tspan><tspan class="t" x="320.4" y="298">failure</tspan><tspan class="t" x="382.8" y="298">removes</tspan><tspan class="t" x="445.2" y="298">only</tspan><tspan class="t" x="484.2" y="298">what</tspan><tspan class="t" x="523.2" y="298">the</tspan><tspan class="t" x="554.4" y="298">invocation</tspan><tspan class="t" x="640.2" y="298">created</tspan><tspan class="t" x="702.6" y="298">and</tspan></text>
