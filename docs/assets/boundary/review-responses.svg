<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 711 194" role="img" aria-labelledby="t review-responses">
  <title id="t">Which failing stage selects which review state · 어느 단계가 실패하면 어떤 검토 상태가 되는가</title>
  <desc id="review-responses">HTTP 422  { status: REVIEW_REQUIRED, issues[{ code, path, message }], workflowState }
  input | canonicalization ambiguity     → INPUT_REVIEW_REQUIRED
  mapping gate                           → MAPPING_REVIEW_REQUIRED
  case approval | profile | rule config  → CASE_REVIEW_REQUIRED
  never: a replay result or canonical result hash
HTTP 500  reserved for defects outside these declared input failures

어느 단계가 실패하면 어떤 검토 상태가 되는가 도식입니다. 그림 안의 글자는 위 내용과 같습니다.</desc>
