<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 696 236" role="img" aria-labelledby="t deployment-boundary">
  <title id="t">What the deployment runs and what the service tier still needs · 배포가 돌리는 것과 서비스 층에 아직 필요한 것</title>
  <desc id="deployment-boundary">Vercel (main)     one Next.js application + local workspace packages
                  fixture mode: no external model, no database
                  server-side only: provider adapters and credentials
                  browser bundles: never a provider credential
service tier      @weavetrail/service-store → SQLite at an explicit persistent path
                  immutable snapshots + derived-result input bindings
                  not wired into the current web deployment
replay workflow   request-local

배포가 돌리는 것과 서비스 층에 아직 필요한 것 도식입니다. 그림 안의 글자는 위 내용과 같습니다.</desc>
