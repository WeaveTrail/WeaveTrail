    <text><tspan class="l" x="24.0" y="235">canonical</tspan><tspan class="l" x="102.0" y="235">dataset</tspan><tspan class="l" x="164.4" y="235">──</tspan><tspan class="l" x="180.0" y="235">hash</tspan><tspan class="l" x="211.2" y="235">──►</tspan><tspan class="l" x="242.4" y="235">canonicalDatasetHash</tspan></text>
