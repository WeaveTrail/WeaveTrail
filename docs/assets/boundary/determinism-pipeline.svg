    <text><tspan class="g" x="47.4" y="67">│</tspan><tspan class="t" x="63.0" y="67">normalize</tspan><tspan class="k" x="148.8" y="67">UTC</tspan><tspan class="t" x="180.0" y="67">nanoseconds</tspan><tspan class="t" x="273.6" y="67">(fixed</tspan><tspan class="t" x="328.2" y="67">width)</tspan><tspan class="g" x="382.8" y="67">·</tspan><tspan class="t" x="398.4" y="67">canonical</tspan><tspan class="t" x="476.4" y="67">decimal</tspan><tspan class="t" x="538.8" y="67">strings</tspan><tspan class="g" x="601.2" y="67">·</tspan><tspan class="t" x="616.8" y="67">signed</tspan><tspan class="t" x="671.4" y="67">zero</tspan></text>
    <text><tspan class="g" x="47.4" y="88">│</tspan><tspan class="g" x="148.8" y="88">·</tspan><tspan class="k" x="164.4" y="88">RFC</tspan><tspan class="t" x="195.6" y="88">8785</tspan><tspan class="t" x="234.6" y="88">§3.2.2.3</tspan><tspan class="t" x="304.8" y="88">finite-number</tspan><tspan class="t" x="414.0" y="88">spelling</tspan></text>
    <text><tspan class="g" x="47.4" y="109">▼</tspan></text>
