    <text><tspan class="g" x="47.4" y="193">│</tspan><tspan class="t" x="63.0" y="193">repeated</tspan><tspan class="t" x="133.2" y="193">eventId</tspan><tspan class="k" x="234.6" y="193">CONFLICTING_EVENT_IDENTIFIER</tspan><tspan class="t" x="460.8" y="193">before</tspan><tspan class="t" x="515.4" y="193">ordering</tspan><tspan class="t" x="585.6" y="193">and</tspan><tspan class="t" x="616.8" y="193">hashing</tspan></text>
