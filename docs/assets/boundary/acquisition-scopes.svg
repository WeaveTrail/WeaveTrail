<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 641 215" role="img" aria-labelledby="t acquisition-scopes">
  <title id="t">The two acquisition scopes and what they never reach · 두 취득 범위와 그것이 닿지 않는 곳</title>
  <desc id="acquisition-scopes">bounded-window   first page, unchanged (existing FSC window)
complete-series  closed identity/family/date selector fixed before retrieval
                 → every returned page retained in order
                 → row count == unchanged publisher total
                 refused: value predicate · incomplete pagination
acquisition scope ──✗──► canonical events · approval hashes
network transport ──✗──► tests · CI · builds · runtime

두 취득 범위와 그것이 닿지 않는 곳 도식입니다. 그림 안의 글자는 위 내용과 같습니다.</desc>
