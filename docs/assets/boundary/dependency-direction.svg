<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 797 320" role="img" aria-labelledby="t dependency-direction">
  <title id="t">Every workspace dependency edge, by tier · 층위별 워크스페이스 의존 간선 전부</title>
  <desc id="dependency-direction">0  contracts        —
1  canonical-kernel → contracts/decimal-string-runtime
   scenarios        → contracts
   published-data   → contracts
2  replay-engine    → contracts, canonical-kernel   (devDependencies: scenarios, published-data)
   ai-harness       → contracts, scenarios, published-data
   service-store    → contracts/service-snapshot, canonical-kernel/canonical-json
   instrument-resolver → contracts/instrument-resolution, canonical-kernel/canonical-json,
                         canonical-kernel/canonical-hash
3  web              → contracts, scenarios, published-data, ai-harness, replay-engine,
                      instrument-resolver
   evals            —

층위별 워크스페이스 의존 간선 전부 도식입니다. 그림 안의 글자는 위 내용과 같습니다.</desc>
