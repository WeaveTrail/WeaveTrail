<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 727 236" role="img" aria-labelledby="t execution-schema-mapping">
  <title id="t">What Mapping Proposal 1.8 fixes, converts and refuses to invent · 항목 연결 제안 1.8이 고정·변환하고 만들어 내지 않는 것</title>
  <desc id="execution-schema-mapping">Mapping Proposal 1.8 (opt-in)   synthetic intraday executions shaped as published
                                FIX 4.4 ExecutionReport and H0STCNT0 response fields
  eventType: TRADE (fixed) · both published side code sets converted
  FIX UTC timestamps converted · H0STCNT0 business date + execution time → explicit KST
  unmappedFields: H0STCNT0 has no participant/account column
    → requires a justified approval override
    → never enters the executable mapping, never creates an actor
Proposals 1.4–1.7   unchanged, no migration

항목 연결 제안 1.8이 고정·변환하고 만들어 내지 않는 것 도식입니다. 그림 안의 글자는 위 내용과 같습니다.</desc>
