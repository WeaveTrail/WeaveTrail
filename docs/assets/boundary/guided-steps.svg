<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 789 194" role="img" aria-labelledby="t guided-steps">
  <title id="t">What a guided step shows and what completes the walkthrough · 안내 단계가 보여 주는 것과 완료 조건</title>
  <desc id="guided-steps">guided step rail    position · title · imperative · unmet condition · the one advancing control
                    then, in its own scroll region: why · authority · step list
                    below the rail breakpoint: action block fixed to the viewport bottom
completion          explicit mapping and case approvals → REPLAYED with evaluation and
                    sourceTrace → open a finding's disclosure → repeat the same approved case
                    → string equality between the baseline hash and the later hash

안내 단계가 보여 주는 것과 완료 조건 도식입니다. 그림 안의 글자는 위 내용과 같습니다.</desc>
