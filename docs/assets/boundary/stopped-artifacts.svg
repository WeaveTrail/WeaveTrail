    <text><tspan class="t" x="281.4" y="109">are</tspan><tspan class="t" x="312.6" y="109">present.</tspan><tspan class="t" x="382.8" y="109">A</tspan><tspan class="t" x="398.4" y="109">failed</tspan><tspan class="k" x="453.0" y="109">HTTP</tspan><tspan class="t" x="492.0" y="109">request</tspan><tspan class="t" x="554.4" y="109">keeps</tspan><tspan class="t" x="601.2" y="109">its</tspan><tspan class="t" x="632.4" y="109">422</tspan><tspan class="t" x="663.6" y="109">review</tspan></text>
