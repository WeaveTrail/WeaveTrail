<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 766 131" role="img" aria-labelledby="t decision-boundary">
  <title id="t">What the replay engine owns and what it never does · 재현 엔진이 소유하는 것과 절대 하지 않는 것</title>
  <desc id="decision-boundary">replay engine owns  ordering · deduplication · decimal arithmetic · window aggregation
                    · rule evaluation · mechanical sensitivity comparison · canonical hashes
replay engine never executes code written by a model

재현 엔진이 소유하는 것과 절대 하지 않는 것 도식입니다. 그림 안의 글자는 위 내용과 같습니다.</desc>
