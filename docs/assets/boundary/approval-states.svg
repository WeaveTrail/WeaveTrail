  <title id="t">The executed approval state machine · 실행되는 승인 상태기계</title>
  <desc id="approval-states">UPLOADED -&gt; MAPPING_PROPOSED -&gt; MAPPING_REVIEW_REQUIRED
                           \-&gt; MAPPING_APPROVED -&gt; CASE_PROPOSED
CASE_PROPOSED -&gt; CASE_REVIEW_REQUIRED
             \-&gt; CASE_APPROVED -&gt; REPLAYED -&gt; EXPORTED

실행되는 승인 상태기계 도식입니다. 그림 안의 글자는 위 내용과 같습니다.</desc>
