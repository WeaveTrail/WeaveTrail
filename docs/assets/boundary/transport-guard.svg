    <text><tspan class="t" x="39.6" y="67">honors</tspan><tspan class="t" x="94.2" y="67">the</tspan><tspan class="t" x="125.4" y="67">30-second</tspan><tspan class="t" x="203.4" y="67">abort</tspan><tspan class="t" x="250.2" y="67">signal</tspan><tspan class="t" x="304.8" y="67">and</tspan><tspan class="t" x="336.0" y="67">redirect:</tspan><tspan class="t" x="414.0" y="67">"error"</tspan></text>
