<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 805 215" role="img" aria-labelledby="t denominator-substitution">
  <title id="t">What a conclusive cross-market 1.1 result reports · 교차시장 1.1이 결론을 낼 때 보고하는 것</title>
  <desc id="denominator-substitution">per leg (approved configuration)   one denominator + ≥1 declared alternative
conclusive output                  approved and recomputed metrics · their ratio
                                   · denominator values and meanings
                                   under the shared MECHANICAL_METRIC_COMPARISON marker
minimum price increment            INSTRUMENT_MINIMUM_PRICE_INCREMENT_NOT_TRADE_ESTABLISHED_LEVEL
                                   an inline approved value retains its provenance
missing declared field | denominator ≤ 0 → INCONCLUSIVE, sensitivity null

교차시장 1.1이 결론을 낼 때 보고하는 것 도식입니다. 그림 안의 글자는 위 내용과 같습니다.</desc>
