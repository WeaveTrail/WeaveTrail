<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 215" role="img" aria-labelledby="t selector-limits">
  <title id="t">What a selector value may and may not be · 선택자 값이 될 수 있는 것과 될 수 없는 것</title>
  <desc id="selector-limits">exact identity values   single ASCII token: letter/digit, then letters, digits,
                        ".", "_", ":" or "-", at most 128 characters
family values           may add Unicode letters and spaces
never accepted          lists · wildcards · expressions · comparison operators
                        · price, volume or outcome as a filter kind
                        · a value predicate inside the date range
                        · publisher parameter names or arbitrary query parameters

선택자 값이 될 수 있는 것과 될 수 없는 것 도식입니다. 그림 안의 글자는 위 내용과 같습니다.</desc>
