<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 735 257" role="img" aria-labelledby="t bundle-12-migration">
  <title id="t">Where each 1.2 field moves in a 1.3 declaration · 1.2의 각 항목이 1.3 선언에서 가는 자리</title>
  <desc id="bundle-12-migration">full engine evaluation            → replay.evaluation   (gate included; null sensitivity
                                                         when INCONCLUSIVE)
canonical events and hashes       → replay
mapping proposals and approvals   → mappings
Manifest 1.3 proposal + approval  → case
old top-level caseId              → case.proposal.caseId
approved proposal hash            → case.approval.approvedArtifactHash, when it exists
old standalone manifestHash       → neither a substitute for the proposal and approval
                                    record nor an additional result-hash input

1.2의 각 항목이 1.3 선언에서 가는 자리 도식입니다. 그림 안의 글자는 위 내용과 같습니다.</desc>
