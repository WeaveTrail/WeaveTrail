    <text><tspan class="g" x="117.6" y="298">·</tspan><tspan class="t" x="133.2" y="298">missing</tspan><tspan class="t" x="195.6" y="298">pages</tspan><tspan class="g" x="242.4" y="298">·</tspan><tspan class="t" x="258.0" y="298">reordered</tspan><tspan class="t" x="336.0" y="298">data</tspan><tspan class="g" x="375.0" y="298">·</tspan><tspan class="t" x="390.6" y="298">mismatched</tspan><tspan class="t" x="476.4" y="298">recorded</tspan><tspan class="t" x="546.6" y="298">requests</tspan></text>
    <text><tspan class="t" x="39.6" y="319">also</tspan><tspan class="t" x="78.6" y="319">required:</tspan><tspan class="t" x="156.6" y="319">the</tspan><tspan class="t" x="187.8" y="319">retained</tspan><tspan class="t" x="258.0" y="319">declaration.json</tspan><tspan class="t" x="390.6" y="319">equals</tspan><tspan class="t" x="445.2" y="319">the</tspan><tspan class="t" x="476.4" y="319">receipt's</tspan><tspan class="t" x="554.4" y="319">declaration,</tspan><tspan class="t" x="655.8" y="319">and</tspan><tspan class="t" x="687.0" y="319">real</tspan></text>
