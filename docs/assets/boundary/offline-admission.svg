    <text><tspan class="t" x="258.0" y="67">scope</tspan><tspan class="t" x="304.8" y="67">declaration,</tspan><tspan class="t" x="406.2" y="67">and</tspan><tspan class="t" x="437.4" y="67">rejects</tspan><tspan class="t" x="499.8" y="67">any</tspan><tspan class="t" x="531.0" y="67">unclaimed</tspan><tspan class="t" x="609.0" y="67">file</tspan><tspan class="t" x="648.0" y="67">in</tspan><tspan class="t" x="671.4" y="67">the</tspan><tspan class="t" x="702.6" y="67">real</tspan></text>
    <text><tspan class="t" x="258.0" y="88">source</tspan><tspan class="t" x="312.6" y="88">tree,</tspan><tspan class="t" x="359.4" y="88">so</tspan><tspan class="t" x="382.8" y="88">omitting</tspan><tspan class="t" x="453.0" y="88">provenance</tspan><tspan class="t" x="538.8" y="88">cannot</tspan><tspan class="t" x="593.4" y="88">evade</tspan><tspan class="t" x="640.2" y="88">checks</tspan></text>
    <text><tspan class="l" x="24.0" y="109">bounded-window</tspan><tspan class="l" x="141.0" y="109">admission</tspan><tspan class="t" x="258.0" y="109">reuses</tspan><tspan class="t" x="312.6" y="109">the</tspan><tspan class="t" x="343.8" y="109">original</tspan><tspan class="k" x="414.0" y="109">FSC</tspan><tspan class="t" x="445.2" y="109">derivation,</tspan><tspan class="t" x="538.8" y="109">checks</tspan><tspan class="t" x="593.4" y="109">source</tspan><tspan class="t" x="648.0" y="109">and</tspan></text>
