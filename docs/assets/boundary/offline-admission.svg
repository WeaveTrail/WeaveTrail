    <text><tspan class="l" x="24.0" y="151">complete-series</tspan><tspan class="l" x="148.8" y="151">admission</tspan><tspan class="t" x="258.0" y="151">requires</tspan><tspan class="t" x="328.2" y="151">an</tspan><tspan class="t" x="351.6" y="151">explicitly</tspan><tspan class="t" x="437.4" y="151">registered</tspan><tspan class="t" x="523.2" y="151">offline</tspan><tspan class="t" x="585.6" y="151">adapter;</tspan><tspan class="t" x="655.8" y="151">an</tspan><tspan class="t" x="679.2" y="151">unknown</tspan></text>
    <text><tspan class="t" x="258.0" y="172">adapter</tspan><tspan class="t" x="320.4" y="172">is</tspan><tspan class="t" x="343.8" y="172">refused</tspan></text>
    <text><tspan class="l" x="24.0" y="193">validateCompleteSeriesArtifact</tspan></text>
    <text><tspan class="t" x="39.6" y="214">re-decodes</tspan><tspan class="t" x="125.4" y="214">every</tspan><tspan class="t" x="172.2" y="214">original</tspan><tspan class="t" x="242.4" y="214">page</tspan><tspan class="g" x="281.4" y="214">·</tspan><tspan class="t" x="297.0" y="214">checks</tspan><tspan class="t" x="351.6" y="214">page</tspan><tspan class="t" x="390.6" y="214">sequence</tspan><tspan class="t" x="460.8" y="214">and</tspan><tspan class="t" x="492.0" y="214">totals</tspan><tspan class="g" x="546.6" y="214">·</tspan><tspan class="t" x="562.2" y="214">reproduces</tspan><tspan class="t" x="648.0" y="214">the</tspan><tspan class="k" x="679.2" y="214">JSONL</tspan></text>
