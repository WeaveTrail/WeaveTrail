<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 626 236" role="img" aria-labelledby="t layer-authority">
  <title id="t">Four layers, one authority each, and the refusal path out of any of them · 네 층위와 각 층의 권한, 그리고 어디서나 가능한 거부 경로</title>
  <desc id="layer-authority">          proposal        approval         result          lineage
L1 interpret ──► L2 approve ──► L3 decide ──► L4 evidence
     ▲                │              │
     │                └── cannot compute
     └── cannot approve               └── cannot widen its own scope

any layer ──► REVIEW_REQUIRED (no result, no result hash)
HTTP boundary: validates every input before L1 acts; not one of the layers

네 층위와 각 층의 권한, 그리고 어디서나 가능한 거부 경로 도식입니다. 그림 안의 글자는 위 내용과 같습니다.</desc>
