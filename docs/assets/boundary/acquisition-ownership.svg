<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 766 215" role="img" aria-labelledby="t acquisition-ownership">
  <title id="t">What acquisition declarations never touch · 취득 선언이 절대 건드리지 않는 것</title>
  <desc id="acquisition-ownership">acquisition declarations   live beside published artifacts and never reach mappings,
                           approvals or canonical event projections
unchanged by them          sourceArtifactHash · rawRowHash · eventId
                           · canonicalDatasetHash · the semantic result hash
ownership                  published data stays in packages/published-data; synthetic
                           scenarios stay synthetic
no call site                in tests using real transport, CI, builds or application runtime

취득 선언이 절대 건드리지 않는 것 도식입니다. 그림 안의 글자는 위 내용과 같습니다.</desc>
