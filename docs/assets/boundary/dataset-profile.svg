<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 789 131" role="img" aria-labelledby="t dataset-profile">
  <title id="t">Case validation stays inside the dataset profile · 사례 검증은 데이터셋 프로파일 안에 머문다</title>
  <desc id="dataset-profile">canonical events → DatasetProfile { canonicalDatasetHash, instruments[], actors[], timeBounds }
case validation ⊆ profile facts                    (validation cannot widen them)
reviewer identity · approval time → audit metadata (outside the semantic result hash)

사례 검증은 데이터셋 프로파일 안에 머문다 도식입니다. 그림 안의 글자는 위 내용과 같습니다.</desc>
