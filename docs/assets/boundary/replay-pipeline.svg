  <text class="eyebrow" x="24" y="26">THE MAPPING AND REPLAY ENDPOINTS AND THE FIVE SERVER STEPS BETWEEN THEM</text>

    <text><tspan class="l" x="24.0" y="46">POST</tspan><tspan class="l" x="63.0" y="46">/api/mapping</tspan><tspan class="l" x="164.4" y="46">{</tspan><tspan class="l" x="180.0" y="46">scenario</tspan><tspan class="l" x="250.2" y="46">}</tspan></text>
    <text><tspan class="g" x="39.6" y="67">→</tspan><tspan class="t" x="55.2" y="67">provider</tspan><tspan class="t" x="125.4" y="67">from</tspan><tspan class="t" x="164.4" y="67">server</tspan><tspan class="t" x="219.0" y="67">configuration</tspan><tspan class="t" x="328.2" y="67">+</tspan><tspan class="t" x="343.8" y="67">closed</tspan><tspan class="t" x="398.4" y="67">artifact</tspan><tspan class="t" x="468.6" y="67">eligibility</tspan><tspan class="t" x="562.2" y="67">registry</tspan></text>
    <text><tspan class="t" x="70.8" y="88">eligible:</tspan><tspan class="t" x="148.8" y="88">the</tspan><tspan class="t" x="180.0" y="88">two</tspan><tspan class="t" x="211.2" y="88">synthetic</tspan><tspan class="t" x="289.2" y="88">source</tspan><tspan class="t" x="343.8" y="88">dialects;</tspan><tspan class="t" x="421.8" y="88">all</tspan><tspan class="t" x="453.0" y="88">others</tspan><tspan class="t" x="507.6" y="88">keep</tspan><tspan class="t" x="546.6" y="88">fixture</tspan><tspan class="t" x="609.0" y="88">mappings</tspan></text>
    <text><tspan class="g" x="39.6" y="109">→</tspan><tspan class="t" x="55.2" y="109">strict</tspan><tspan class="t" x="109.8" y="109">mapping</tspan><tspan class="t" x="172.2" y="109">validation</tspan></text>
    <text><tspan class="g" x="39.6" y="130">→</tspan><tspan class="t" x="55.2" y="130">{</tspan><tspan class="t" x="70.8" y="130">mode,</tspan><tspan class="t" x="117.6" y="130">proposal,</tspan><tspan class="t" x="195.6" y="130">mappingReceipt?</tspan><tspan class="t" x="320.4" y="130">}</tspan><tspan class="t" x="390.6" y="130">provider</tspan><tspan class="t" x="460.8" y="130">failure</tspan><tspan class="g" x="523.2" y="130">→</tspan><tspan class="t" x="538.8" y="130">422</tspan><tspan class="t" x="570.0" y="130">mapping</tspan><tspan class="t" x="632.4" y="130">review</tspan></text>
    <text><tspan class="t" x="39.6" y="151">receipt:</tspan><tspan class="t" x="109.8" y="151">model</tspan><tspan class="t" x="156.6" y="151">id</tspan><tspan class="t" x="180.0" y="151">+</tspan><tspan class="t" x="195.6" y="151">prompt</tspan><tspan class="t" x="250.2" y="151">version</tspan><tspan class="t" x="312.6" y="151">recorded</tspan><tspan class="t" x="382.8" y="151">server-side,</tspan><tspan class="t" x="484.2" y="151">encrypted,</tspan><tspan class="t" x="570.0" y="151">expires</tspan><tspan class="t" x="632.4" y="151">30</tspan><tspan class="t" x="655.8" y="151">min,</tspan></text>
    <text><tspan class="t" x="109.8" y="172">revalidated</tspan><tspan class="t" x="203.4" y="172">before</tspan><tspan class="t" x="258.0" y="172">the</tspan><tspan class="t" x="289.2" y="172">approval</tspan><tspan class="t" x="359.4" y="172">gate;</tspan><tspan class="t" x="406.2" y="172">neither</tspan><tspan class="t" x="468.6" y="172">receipt</tspan><tspan class="t" x="531.0" y="172">nor</tspan><tspan class="t" x="562.2" y="172">model</tspan><tspan class="t" x="609.0" y="172">output</tspan><tspan class="t" x="663.6" y="172">approves</tspan></text>
    <text><tspan class="l" x="24.0" y="214">POST</tspan><tspan class="l" x="63.0" y="214">/api/replay</tspan><tspan class="l" x="156.6" y="214">{</tspan><tspan class="l" x="172.2" y="214">scenario,</tspan><tspan class="l" x="250.2" y="214">mutation,</tspan><tspan class="l" x="328.2" y="214">rows</tspan><tspan class="l" x="367.2" y="214">1..64,</tspan><tspan class="l" x="421.8" y="214">mappingApproval?,</tspan><tspan class="l" x="562.2" y="214">mappingReceipt?,</tspan><tspan class="l" x="694.8" y="214">caseManifest?</tspan><tspan class="l" x="804.0" y="214">(approved</tspan><tspan class="l" x="882.0" y="214">CaseManifest)</tspan><tspan class="l" x="991.2" y="214">}</tspan></text>
    <text><tspan class="t" x="39.6" y="235">1</tspan><tspan class="t" x="55.2" y="235">obtain</tspan><tspan class="t" x="109.8" y="235">the</tspan><tspan class="t" x="141.0" y="235">scenario</tspan><tspan class="t" x="211.2" y="235">proposal</tspan><tspan class="t" x="367.2" y="235">caller-authored</tspan><tspan class="t" x="492.0" y="235">canonical</tspan><tspan class="t" x="570.0" y="235">events</tspan><tspan class="g" x="624.6" y="235">→</tspan><tspan class="t" x="640.2" y="235">rejected</tspan></text>
    <text><tspan class="t" x="39.6" y="256">2</tspan><tspan class="t" x="55.2" y="256">verify</tspan><tspan class="t" x="109.8" y="256">the</tspan><tspan class="t" x="141.0" y="256">approval</tspan><tspan class="t" x="211.2" y="256">against</tspan><tspan class="t" x="273.6" y="256">that</tspan><tspan class="t" x="312.6" y="256">exact</tspan><tspan class="t" x="359.4" y="256">proposal</tspan></text>
    <text><tspan class="t" x="39.6" y="277">3</tspan><tspan class="t" x="55.2" y="277">derive</tspan><tspan class="t" x="109.8" y="277">the</tspan><tspan class="t" x="141.0" y="277">executable</tspan><tspan class="t" x="226.8" y="277">mapping</tspan><tspan class="t" x="289.2" y="277">as</tspan><tspan class="t" x="312.6" y="277">a</tspan><tspan class="t" x="328.2" y="277">pure</tspan><tspan class="t" x="367.2" y="277">projection</tspan></text>
    <text><tspan class="t" x="39.6" y="298">4</tspan><tspan class="t" x="55.2" y="298">compare</tspan><tspan class="t" x="117.6" y="298">every</tspan><tspan class="t" x="164.4" y="298">submitted</tspan><tspan class="t" x="242.4" y="298">row</tspan><tspan class="t" x="273.6" y="298">with</tspan><tspan class="t" x="312.6" y="298">the</tspan><tspan class="t" x="343.8" y="298">server-owned</tspan><tspan class="t" x="445.2" y="298">committed</tspan><tspan class="t" x="523.2" y="298">row</tspan><tspan class="t" x="554.4" y="298">at</tspan><tspan class="t" x="577.8" y="298">the</tspan><tspan class="t" x="609.0" y="298">same</tspan><tspan class="t" x="648.0" y="298">coordinate</tspan></text>
    <text><tspan class="t" x="70.8" y="319">missing</tspan><tspan class="t" x="133.2" y="319">coordinate</tspan><tspan class="t" x="219.0" y="319">|</tspan><tspan class="t" x="234.6" y="319">differing</tspan><tspan class="t" x="312.6" y="319">column</tspan><tspan class="g" x="367.2" y="319">→</tspan><tspan class="t" x="382.8" y="319">fail</tspan><tspan class="t" x="421.8" y="319">closed,</tspan><tspan class="t" x="484.2" y="319">never</tspan><tspan class="t" x="531.0" y="319">substituted</tspan></text>
    <text><tspan class="t" x="39.6" y="340">5</tspan><tspan class="t" x="55.2" y="340">derive</tspan><tspan class="t" x="109.8" y="340">events,</tspan><tspan class="t" x="172.2" y="340">preserving</tspan><tspan class="t" x="258.0" y="340">submitted</tspan><tspan class="t" x="336.0" y="340">order</tspan></text>
    <text><tspan class="g" x="39.6" y="361">→</tspan><tspan class="t" x="55.2" y="361">no</tspan><tspan class="t" x="78.6" y="361">case</tspan><tspan class="t" x="117.6" y="361">manifest:</tspan><tspan class="t" x="195.6" y="361">stops</tspan><tspan class="t" x="242.4" y="361">at</tspan><tspan class="k" x="265.8" y="361">MAPPING_APPROVED,</tspan><tspan class="t" x="406.2" y="361">no</tspan><tspan class="t" x="429.6" y="361">sourceTrace</tspan></text>
    <text><tspan class="g" x="39.6" y="382">→</tspan><tspan class="t" x="55.2" y="382">approved</tspan><tspan class="t" x="125.4" y="382">case:</tspan><tspan class="k" x="195.6" y="382">REPLAYED</tspan><tspan class="t" x="265.8" y="382">+</tspan><tspan class="t" x="281.4" y="382">closed</tspan><tspan class="t" x="336.0" y="382">rule</tspan><tspan class="t" x="375.0" y="382">result</tspan><tspan class="t" x="429.6" y="382">+</tspan><tspan class="t" x="445.2" y="382">5</tspan><tspan class="t" x="460.8" y="382">gate</tspan><tspan class="t" x="499.8" y="382">findings</tspan><tspan class="t" x="570.0" y="382">(conclusive)</tspan></text>
    <text><tspan class="t" x="195.6" y="403">+</tspan><tspan class="t" x="211.2" y="403">mechanical</tspan><tspan class="t" x="297.0" y="403">sensitivity</tspan><tspan class="t" x="390.6" y="403">comparison</tspan><tspan class="t" x="476.4" y="403">+</tspan><tspan class="t" x="492.0" y="403">sourceTrace</tspan></text>
</svg>
