<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 813 236" role="img" aria-labelledby="t interpretation-boundary">
  <title id="t">Provider output becomes a proposal only after strict validation · 공급자 출력은 엄격한 검증을 통과해야 제안이 된다</title>
  <desc id="interpretation-boundary">provider output (untrusted data)
  → columns: existing source columns only · transforms: fixed allowlist
  → strict 1.4 validation
      invalid shape | low confidence | unknown column | unsupported transform
        → REVIEW_REQUIRED
  → proposal (not an approval)
browser (Web Crypto) ─┬─ one runtime-neutral canonical serializer ─┬─► same proposal hash
server (recompute)  ──┘                                            └─► required overrides enforced

공급자 출력은 엄격한 검증을 통과해야 제안이 된다 도식입니다. 그림 안의 글자는 위 내용과 같습니다.</desc>
