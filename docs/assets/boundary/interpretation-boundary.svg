      .l{fill:#0c1513;font-weight:600}
      .k{fill:#14211f;font-weight:600}
      .t{fill:#263230}
      .g{fill:#0b6e6a}
    </style>
  </defs>

  <rect width="813" height="236" fill="#ffffff"/>
  <rect width="813" height="4" fill="#0b6e6a"/>
  <rect x=".5" y=".5" width="812" height="235" fill="none" stroke="#d0d7de"/>
  <text class="eyebrow" x="24" y="26">PROVIDER OUTPUT BECOMES A PROPOSAL ONLY AFTER STRICT VALIDATION</text>

    <text><tspan class="l" x="24.0" y="46">provider</tspan><tspan class="l" x="94.2" y="46">output</tspan><tspan class="l" x="148.8" y="46">(untrusted</tspan><tspan class="l" x="234.6" y="46">data)</tspan></text>
    <text><tspan class="g" x="39.6" y="67">→</tspan><tspan class="t" x="55.2" y="67">columns:</tspan><tspan class="t" x="125.4" y="67">existing</tspan><tspan class="t" x="195.6" y="67">source</tspan><tspan class="t" x="250.2" y="67">columns</tspan><tspan class="t" x="312.6" y="67">only</tspan><tspan class="g" x="351.6" y="67">·</tspan><tspan class="t" x="367.2" y="67">transforms:</tspan><tspan class="t" x="460.8" y="67">fixed</tspan><tspan class="t" x="507.6" y="67">allowlist</tspan></text>
    <text><tspan class="g" x="39.6" y="88">→</tspan><tspan class="t" x="55.2" y="88">strict</tspan><tspan class="t" x="109.8" y="88">1.4</tspan><tspan class="t" x="141.0" y="88">validation</tspan></text>
    <text><tspan class="t" x="70.8" y="109">invalid</tspan><tspan class="t" x="133.2" y="109">shape</tspan><tspan class="t" x="180.0" y="109">|</tspan><tspan class="t" x="195.6" y="109">low</tspan><tspan class="t" x="226.8" y="109">confidence</tspan><tspan class="t" x="312.6" y="109">|</tspan><tspan class="t" x="328.2" y="109">unknown</tspan><tspan class="t" x="390.6" y="109">column</tspan><tspan class="t" x="445.2" y="109">|</tspan><tspan class="t" x="460.8" y="109">unsupported</tspan><tspan class="t" x="554.4" y="109">transform</tspan></text>
    <text><tspan class="g" x="86.4" y="130">→</tspan><tspan class="k" x="102.0" y="130">REVIEW_REQUIRED</tspan></text>
    <text><tspan class="g" x="39.6" y="151">→</tspan><tspan class="t" x="55.2" y="151">proposal</tspan><tspan class="t" x="125.4" y="151">(not</tspan><tspan class="t" x="164.4" y="151">an</tspan><tspan class="t" x="187.8" y="151">approval)</tspan></text>
    <text><tspan class="l" x="24.0" y="172">browser</tspan><tspan class="l" x="86.4" y="172">(Web</tspan><tspan class="l" x="125.4" y="172">Crypto)</tspan><tspan class="l" x="187.8" y="172">─┬─</tspan><tspan class="l" x="219.0" y="172">one</tspan><tspan class="l" x="250.2" y="172">runtime-neutral</tspan><tspan class="l" x="375.0" y="172">canonical</tspan><tspan class="l" x="453.0" y="172">serializer</tspan><tspan class="l" x="538.8" y="172">─┬─►</tspan><tspan class="l" x="577.8" y="172">same</tspan><tspan class="l" x="616.8" y="172">proposal</tspan><tspan class="l" x="687.0" y="172">hash</tspan></text>
