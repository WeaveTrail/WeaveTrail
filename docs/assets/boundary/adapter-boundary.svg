  <text class="eyebrow" x="24" y="26">WHAT A REVIEWED PUBLISHER ADAPTER BINDS AND WHAT ITS DECODER MUST NOT DO</text>

    <text><tspan class="l" x="24.0" y="46">publisher</tspan><tspan class="l" x="102.0" y="46">adapter</tspan><tspan class="t" x="180.0" y="46">reviewed</tspan><tspan class="t" x="250.2" y="46">repository</tspan><tspan class="t" x="336.0" y="46">code</tspan><tspan class="g" x="375.0" y="46">—</tspan><tspan class="t" x="390.6" y="46">never</tspan><tspan class="t" x="437.4" y="46">an</tspan><tspan class="t" x="460.8" y="46">operator</tspan><tspan class="t" x="531.0" y="46">or</tspan><tspan class="t" x="554.4" y="46">model</tspan><tspan class="t" x="601.2" y="46">declaration,</tspan></text>
    <text><tspan class="t" x="180.0" y="67">never</tspan><tspan class="t" x="226.8" y="67">loaded</tspan><tspan class="t" x="281.4" y="67">from</tspan><tspan class="t" x="320.4" y="67">artifact</tspan><tspan class="t" x="390.6" y="67">metadata</tspan></text>
    <text><tspan class="t" x="39.6" y="88">request</tspan><tspan class="t" x="102.0" y="88">spec</tspan><tspan class="t" x="180.0" y="88">fixed</tspan><tspan class="t" x="226.8" y="88">endpoint</tspan><tspan class="g" x="297.0" y="88">·</tspan><tspan class="t" x="312.6" y="88">publisher</tspan><tspan class="t" x="390.6" y="88">parameter</tspan><tspan class="t" x="468.6" y="88">names</tspan><tspan class="g" x="515.4" y="88">·</tspan><tspan class="t" x="531.0" y="88">single</tspan><tspan class="t" x="585.6" y="88">date</tspan><tspan class="t" x="624.6" y="88">or</tspan><tspan class="t" x="648.0" y="88">half-open</tspan></text>
    <text><tspan class="t" x="180.0" y="109">range</tspan><tspan class="g" x="226.8" y="109">·</tspan><tspan class="t" x="242.4" y="109">identity</tspan><tspan class="t" x="312.6" y="109">or</tspan><tspan class="t" x="336.0" y="109">family</tspan><tspan class="t" x="390.6" y="109">selector</tspan><tspan class="g" x="460.8" y="109">·</tspan><tspan class="t" x="476.4" y="109">page</tspan><tspan class="t" x="515.4" y="109">number</tspan><tspan class="g" x="570.0" y="109">·</tspan><tspan class="t" x="585.6" y="109">page</tspan><tspan class="t" x="624.6" y="109">size</tspan></text>
    <text><tspan class="g" x="180.0" y="130">·</tspan><tspan class="t" x="195.6" y="130">optional</tspan><tspan class="t" x="265.8" y="130">response</tspan><tspan class="t" x="336.0" y="130">format</tspan></text>
    <text><tspan class="t" x="39.6" y="151">during</tspan><tspan class="t" x="94.2" y="151">retrieval</tspan><tspan class="t" x="180.0" y="151">only</tspan><tspan class="t" x="219.0" y="151">the</tspan><tspan class="t" x="250.2" y="151">page</tspan><tspan class="t" x="289.2" y="151">number</tspan><tspan class="t" x="343.8" y="151">changes;</tspan><tspan class="t" x="414.0" y="151">settings</tspan><tspan class="t" x="484.2" y="151">and</tspan><tspan class="t" x="515.4" y="151">the</tspan><tspan class="t" x="546.6" y="151">logical</tspan><tspan class="t" x="609.0" y="151">declaration</tspan></text>
    <text><tspan class="t" x="180.0" y="172">are</tspan><tspan class="t" x="211.2" y="172">copied</tspan><tspan class="t" x="265.8" y="172">and</tspan><tspan class="t" x="297.0" y="172">frozen</tspan><tspan class="t" x="351.6" y="172">before</tspan><tspan class="t" x="406.2" y="172">transport,</tspan><tspan class="t" x="492.0" y="172">each</tspan><tspan class="t" x="531.0" y="172">request</tspan><tspan class="t" x="593.4" y="172">immutable</tspan></text>
    <text><tspan class="t" x="39.6" y="193">endpoint</tspan><tspan class="k" x="180.0" y="193">HTTPS,</tspan><tspan class="t" x="234.6" y="193">no</tspan><tspan class="t" x="258.0" y="193">embedded</tspan><tspan class="t" x="328.2" y="193">query,</tspan><tspan class="t" x="382.8" y="193">fragment</tspan><tspan class="t" x="453.0" y="193">or</tspan><tspan class="t" x="476.4" y="193">credentials</tspan></text>
    <text><tspan class="t" x="39.6" y="214">review</tspan><tspan class="t" x="94.2" y="214">must</tspan><tspan class="t" x="133.2" y="214">fix</tspan><tspan class="t" x="180.0" y="214">whether</tspan><tspan class="t" x="242.4" y="214">each</tspan><tspan class="t" x="281.4" y="214">selector</tspan><tspan class="t" x="351.6" y="214">means</tspan><tspan class="t" x="398.4" y="214">exact</tspan><tspan class="t" x="445.2" y="214">equality</tspan><tspan class="t" x="515.4" y="214">or</tspan><tspan class="t" x="538.8" y="214">literal</tspan><tspan class="t" x="601.2" y="214">family</tspan><tspan class="t" x="655.8" y="214">match</tspan></text>
    <text><tspan class="g" x="180.0" y="235">·</tspan><tspan class="t" x="195.6" y="235">that</tspan><tspan class="t" x="234.6" y="235">a</tspan><tspan class="t" x="250.2" y="235">format</tspan><tspan class="t" x="304.8" y="235">control</tspan><tspan class="t" x="367.2" y="235">is</tspan><tspan class="t" x="390.6" y="235">not</tspan><tspan class="t" x="421.8" y="235">a</tspan><tspan class="t" x="437.4" y="235">selection</tspan><tspan class="t" x="515.4" y="235">predicate</tspan></text>
    <text><tspan class="g" x="180.0" y="256">·</tspan><tspan class="t" x="195.6" y="256">that</tspan><tspan class="t" x="234.6" y="256">the</tspan><tspan class="t" x="265.8" y="256">decoder</tspan><tspan class="t" x="328.2" y="256">checks</tspan><tspan class="t" x="382.8" y="256">provider</tspan><tspan class="t" x="453.0" y="256">success</tspan><tspan class="t" x="515.4" y="256">and</tspan><tspan class="t" x="546.6" y="256">exposes</tspan><tspan class="t" x="609.0" y="256">the</tspan><tspan class="t" x="640.2" y="256">complete</tspan></text>
    <text><tspan class="t" x="195.6" y="277">original</tspan><tspan class="t" x="265.8" y="277">item</tspan><tspan class="t" x="304.8" y="277">array</tspan></text>
    <text><tspan class="t" x="39.6" y="298">decoder</tspan><tspan class="t" x="180.0" y="298">receives</tspan><tspan class="t" x="250.2" y="298">the</tspan><tspan class="t" x="281.4" y="298">frozen</tspan><tspan class="t" x="336.0" y="298">declaration,</tspan><tspan class="t" x="437.4" y="298">so</tspan><tspan class="t" x="460.8" y="298">returned</tspan><tspan class="t" x="531.0" y="298">scope</tspan><tspan class="t" x="577.8" y="298">identities</tspan><tspan class="t" x="663.6" y="298">can</tspan><tspan class="t" x="694.8" y="298">be</tspan></text>
    <text><tspan class="t" x="180.0" y="319">checked</tspan><tspan class="t" x="242.4" y="319">where</tspan><tspan class="t" x="289.2" y="319">the</tspan><tspan class="t" x="320.4" y="319">publisher</tspan><tspan class="t" x="398.4" y="319">supplies</tspan><tspan class="t" x="468.6" y="319">them</tspan></text>
    <text><tspan class="t" x="180.0" y="340">returns</tspan><tspan class="t" x="242.4" y="340">page</tspan><tspan class="t" x="281.4" y="340">number,</tspan><tspan class="t" x="343.8" y="340">page</tspan><tspan class="t" x="382.8" y="340">size</tspan><tspan class="t" x="421.8" y="340">and</tspan><tspan class="t" x="453.0" y="340">publisher</tspan><tspan class="t" x="531.0" y="340">total</tspan><tspan class="t" x="577.8" y="340">as</tspan><tspan class="t" x="601.2" y="340">canonical</tspan></text>
    <text><tspan class="t" x="180.0" y="361">integer</tspan><tspan class="t" x="242.4" y="361">strings;</tspan><tspan class="t" x="312.6" y="361">retains</tspan><tspan class="t" x="375.0" y="361">every</tspan><tspan class="t" x="421.8" y="361">column</tspan><tspan class="t" x="476.4" y="361">and</tspan><tspan class="t" x="507.6" y="361">row</tspan><tspan class="t" x="538.8" y="361">as</tspan><tspan class="t" x="562.2" y="361">strings</tspan></text>
    <text><tspan class="t" x="180.0" y="382">must</tspan><tspan class="t" x="219.0" y="382">not</tspan><tspan class="t" x="250.2" y="382">coerce,</tspan><tspan class="t" x="312.6" y="382">filter,</tspan><tspan class="t" x="375.0" y="382">sort,</tspan><tspan class="t" x="421.8" y="382">deduplicate</tspan><tspan class="t" x="515.4" y="382">or</tspan><tspan class="t" x="538.8" y="382">fabricate</tspan><tspan class="t" x="616.8" y="382">a</tspan><tspan class="t" x="632.4" y="382">field</tspan></text>
    <text><tspan class="t" x="180.0" y="403">new</tspan><tspan class="t" x="211.2" y="403">publisher</tspan><tspan class="t" x="289.2" y="403">columns</tspan><tspan class="t" x="351.6" y="403">get</tspan><tspan class="t" x="382.8" y="403">no</tspan><tspan class="t" x="406.2" y="403">canonical</tspan><tspan class="t" x="484.2" y="403">mapping</tspan><tspan class="t" x="546.6" y="403">from</tspan><tspan class="t" x="585.6" y="403">this</tspan><tspan class="t" x="624.6" y="403">mechanism</tspan></text>
</svg>
