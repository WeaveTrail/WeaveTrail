      .l{fill:#0c1513;font-weight:600}
      .k{fill:#14211f;font-weight:600}
      .t{fill:#263230}
      .g{fill:#0b6e6a}
    </style>
  </defs>

  <rect width="813" height="299" fill="#ffffff"/>
  <rect width="813" height="4" fill="#0b6e6a"/>
  <rect x=".5" y=".5" width="812" height="298" fill="none" stroke="#d0d7de"/>
  <text class="eyebrow" x="24" y="26">THE CANONICAL SERIALIZATION RULES BOTH HASHES USE</text>

    <text><tspan class="l" x="24.0" y="46">sha256Canonical</tspan><tspan class="l" x="148.8" y="46">=</tspan><tspan class="l" x="164.4" y="46">SHA-256(UTF-8</tspan><tspan class="l" x="273.6" y="46">bytes</tspan><tspan class="l" x="320.4" y="46">of</tspan><tspan class="l" x="343.8" y="46">canonicalJson(value))</tspan><tspan class="l" x="515.4" y="46">→</tspan><tspan class="l" x="531.0" y="46">64</tspan><tspan class="l" x="554.4" y="46">lowercase</tspan><tspan class="l" x="632.4" y="46">hex</tspan></text>
    <text><tspan class="t" x="39.6" y="67">no</tspan><tspan class="k" x="63.0" y="67">BOM</tspan><tspan class="g" x="94.2" y="67">·</tspan><tspan class="t" x="109.8" y="67">no</tspan><tspan class="t" x="133.2" y="67">whitespace</tspan><tspan class="t" x="219.0" y="67">padding</tspan><tspan class="g" x="281.4" y="67">·</tspan><tspan class="t" x="297.0" y="67">no</tspan><tspan class="t" x="320.4" y="67">trailing</tspan><tspan class="t" x="390.6" y="67">newline</tspan></text>
    <text><tspan class="t" x="39.6" y="88">object</tspan><tspan class="t" x="94.2" y="88">keys</tspan><tspan class="t" x="172.2" y="88">lexicographic</tspan><tspan class="t" x="281.4" y="88">by</tspan><tspan class="k" x="304.8" y="88">UTF-16</tspan><tspan class="t" x="359.4" y="88">code</tspan><tspan class="t" x="398.4" y="88">unit</tspan><tspan class="t" x="437.4" y="88">at</tspan><tspan class="t" x="460.8" y="88">every</tspan><tspan class="t" x="507.6" y="88">depth,</tspan><tspan class="t" x="562.2" y="88">integer-looking</tspan><tspan class="t" x="687.0" y="88">keys</tspan><tspan class="t" x="726.0" y="88">included</tspan></text>
    <text><tspan class="t" x="39.6" y="109">undefined</tspan><tspan class="t" x="172.2" y="109">object</tspan><tspan class="t" x="226.8" y="109">properties</tspan><tspan class="t" x="312.6" y="109">omitted</tspan></text>
    <text><tspan class="t" x="39.6" y="130">arrays</tspan><tspan class="t" x="172.2" y="130">supplied</tspan><tspan class="t" x="242.4" y="130">order</tspan><tspan class="t" x="289.2" y="130">kept;</tspan><tspan class="t" x="336.0" y="130">holes,</tspan><tspan class="t" x="390.6" y="130">undefined</tspan><tspan class="t" x="468.6" y="130">elements</tspan><tspan class="t" x="538.8" y="130">and</tspan><tspan class="t" x="570.0" y="130">a</tspan><tspan class="t" x="585.6" y="130">top-level</tspan></text>
    <text><tspan class="t" x="172.2" y="151">undefined</tspan><tspan class="t" x="250.2" y="151">value</tspan><tspan class="t" x="297.0" y="151">rejected</tspan></text>
    <text><tspan class="t" x="39.6" y="172">null</tspan><tspan class="t" x="172.2" y="172">a</tspan><tspan class="t" x="187.8" y="172">value,</tspan><tspan class="t" x="242.4" y="172">distinct</tspan><tspan class="t" x="312.6" y="172">from</tspan><tspan class="t" x="351.6" y="172">an</tspan><tspan class="t" x="375.0" y="172">absent</tspan><tspan class="t" x="429.6" y="172">property</tspan></text>
    <text><tspan class="t" x="39.6" y="193">numbers</tspan><tspan class="t" x="172.2" y="193">finite</tspan><tspan class="t" x="226.8" y="193">only;</tspan><tspan class="k" x="273.6" y="193">ECMAScript</tspan><tspan class="k" x="359.4" y="193">JSON.stringify</tspan><tspan class="t" x="476.4" y="193">spelling,</tspan><tspan class="t" x="554.4" y="193">negative</tspan><tspan class="t" x="624.6" y="193">zero</tspan><tspan class="t" x="663.6" y="193">as</tspan><tspan class="t" x="687.0" y="193">0</tspan></text>
    <text><tspan class="k" x="172.2" y="214">(RFC</tspan><tspan class="t" x="211.2" y="214">8785</tspan><tspan class="t" x="250.2" y="214">§3.2.2.3)</tspan></text>
    <text><tspan class="t" x="39.6" y="235">strings</tspan><tspan class="k" x="172.2" y="235">JSON</tspan><tspan class="t" x="211.2" y="235">escaping,</tspan><tspan class="t" x="289.2" y="235">no</tspan><tspan class="t" x="312.6" y="235">Unicode</tspan><tspan class="t" x="375.0" y="235">normalization</tspan></text>
    <text><tspan class="l" x="24.0" y="256">not</tspan><tspan class="l" x="55.2" y="256">claimed</tspan><tspan class="t" x="172.2" y="256">full</tspan><tspan class="k" x="211.2" y="256">JCS</tspan><tspan class="t" x="242.4" y="256">compliance</tspan><tspan class="t" x="328.2" y="256">(no</tspan><tspan class="t" x="359.4" y="256">extra</tspan><tspan class="t" x="406.2" y="256">lone-surrogate</tspan><tspan class="t" x="523.2" y="256">validation)</tspan></text>
</svg>
