<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="layersTitle layersDesc">
  <title id="layersTitle">Planned layer separation: a model proposes, a person approves, fixed code decides, and each sentence will carry the badge of the layer that vouches for it</title>
  <desc id="layersDesc">The planned four layers run left to right, from an official release, published market data or a pasted analysis to a sentence on screen with its evidence. Layer one, interpret: a model proposes a release's facts with the passages they came from, and the claims worth checking in a pasted text; it computes nothing. Layer two, approve: a person fixes what will be examined before anything runs and adopts the conclusions that go into a brief; approval cannot edit a result. Layer three, decide: fixed code matches every quotation against the original bytes and recomputes every number from verified source data, and where data is absent it says so instead of guessing. Layer four, evidence: on the planned surface, each sentence opens onto its source passage, or onto its rows, formula and definition, and a shared link pins the snapshots it used. Beneath the layers are the five evidence badges: quoted, recomputed, differs and not confirmable are checked by code, and AI interpretation is a model's proposal.</desc>
  <!--
    Hand-authored README figure. The English and Korean files share one geometry;
    each language brings its own line breaks and chip widths.
    WeaveTrail design system, pinned at design-reference@d780236766c1e0fddcc1976c252aba35b3898fe4
    Literal hex, because CSS custom properties do not resolve inside a standalone SVG.
    #f7faf9 paper-1 | #ffffff paper-0 | #f0f5f4 surface-sunken
    #0c1513 ink-900 | #14211f ink-800 authorship-code | #263230 ink-700 | #566461 ink-500
    #0b6e6a teal-700 authorship-human | #e6f2f1 teal-tint
    #4f6270 authorship-ai state-review | #eef1f2 slate-tint
    #8a6a12 result-inconclusive | #fbf4e4 amber-tint
    #d0d7de ledger-rule
  -->
  <defs>
    <style>
      .s{font-family:"IBM Plex Sans","IBM Plex Sans KR","Segoe UI",Helvetica,Arial,sans-serif}
      .m{font-family:"JetBrains Mono","IBM Plex Mono",ui-monospace,SFMono-Regular,Consolas,monospace}
      .eyebrow{font-size:11px;font-weight:600;letter-spacing:.08em;fill:#0b6e6a}
      .title{font-size:28px;font-weight:600;fill:#0c1513;letter-spacing:-.01em}
      .sub{font-size:14px;fill:#566461}
      .stage{font-size:18px;font-weight:600;fill:#0c1513}
      .body{font-size:13px;fill:#263230}
      .foot{font-size:11px;fill:#566461}
      .chip{font-size:10px;font-weight:600;letter-spacing:.06em}
      .badge{font-size:12px;font-weight:600}
      .band{font-size:11px;font-weight:600;letter-spacing:.08em;fill:#566461}
      .ctx{font-size:11px;fill:#7d8b88}
      .rule{stroke:#d0d7de;stroke-width:1}
    </style>
  </defs>

  <rect width="1200" height="520" fill="#f7faf9"/>
  <rect width="1200" height="4" fill="#0b6e6a"/>
  <rect x=".5" y=".5" width="1199" height="519" fill="none" stroke="#d0d7de"/>

  <g class="s">
    <text class="eyebrow" x="40" y="48">LAYER SEPARATION</text>
    <text class="title" x="40" y="84">AI proposes. A person approves. Code decides.</text>
    <text class="sub" x="40" y="112">Dashed slate is model output and is never trusted. Teal is a person's decision. Ink is fixed code.</text>
    <text class="sub" x="40" y="132">No layer holds two authorities. On the planned surface, each sentence carries the badge of the layer that vouches for it.</text>
  </g>
  <line class="rule" x1="40" y1="150" x2="1160" y2="150"/>

  <g class="s">
    <text class="ctx" x="40" y="176">FROM · an official release, published market data, or a pasted analysis</text>
    <text class="ctx" x="1160" y="176" text-anchor="end">TO · a planned sentence on screen, with its evidence</text>
  </g>

  <!-- stage 1 -->
  <rect x="40" y="192" width="262" height="200" fill="#eef1f2" stroke="#4f6270" stroke-dasharray="4 3"/>
  <rect x="56" y="208" width="94" height="18" fill="#ffffff" stroke="#4f6270" stroke-dasharray="4 3"/>
  <text class="s chip" x="64" y="221" fill="#4f6270">AI PROPOSES</text>
  <g class="s">
    <text class="stage" x="56" y="256">L1 · Interpret</text>
    <text class="body" x="56" y="284">A model proposes a release's</text>
    <text class="body" x="56" y="304">facts with the passages they</text>
    <text class="body" x="56" y="324">came from, and the claims worth</text>
    <text class="body" x="56" y="344">checking in a pasted text.</text>
    <text class="foot" x="56" y="374">computes nothing</text>
  </g>

  <!-- stage 2 -->
  <rect x="326" y="192" width="262" height="200" fill="#e6f2f1" stroke="#0b6e6a"/>
  <rect x="342" y="208" width="114" height="18" fill="#ffffff" stroke="#0b6e6a"/>
  <text class="s chip" x="350" y="221" fill="#0b6e6a">HUMAN APPROVES</text>
  <g class="s">
    <text class="stage" x="342" y="256">L2 · Approve</text>
    <text class="body" x="342" y="284">A person fixes what will be</text>
    <text class="body" x="342" y="304">examined before anything runs,</text>
    <text class="body" x="342" y="324">and adopts the conclusions</text>
    <text class="body" x="342" y="344">that go into a brief.</text>
    <text class="foot" x="342" y="374">cannot edit a result</text>
  </g>

  <!-- stage 3 -->
  <rect x="612" y="192" width="262" height="200" fill="#ffffff" stroke="#14211f"/>
  <rect x="628" y="208" width="100" height="18" fill="#f0f5f4" stroke="#14211f"/>
  <text class="s chip" x="636" y="221" fill="#14211f">CODE DECIDES</text>
  <g class="s">
    <text class="stage" x="628" y="256">L3 · Decide</text>
    <text class="body" x="628" y="284">Fixed code matches every</text>
    <text class="body" x="628" y="304">quotation against the original</text>
    <text class="body" x="628" y="324">bytes and recomputes every</text>
    <text class="body" x="628" y="344">number from verified source data.</text>
    <text class="foot" x="628" y="374">no data, no guess</text>
  </g>

  <!-- stage 4 -->
  <rect x="898" y="192" width="262" height="200" fill="#ffffff" stroke="#14211f"/>
  <rect x="914" y="208" width="102" height="18" fill="#f0f5f4" stroke="#14211f"/>
  <text class="s chip" x="922" y="221" fill="#14211f">CODE RECORDS</text>
  <g class="s">
    <text class="stage" x="914" y="256">L4 · Evidence</text>
    <text class="body" x="914" y="284">On the planned surface, each</text>
    <text class="body" x="914" y="304">sentence opens onto its source</text>
    <text class="body" x="914" y="324">passage, rows, formula and</text>
    <text class="body" x="914" y="344">definition; links pin inputs.</text>
    <text class="foot" x="914" y="374">planned sentence → source</text>
  </g>

  <g fill="#0b6e6a">
    <path d="M306 286l10 6-10 6z"/>
    <path d="M592 286l10 6-10 6z"/>
    <path d="M878 286l10 6-10 6z"/>
  </g>

  <line class="rule" x1="40" y1="422" x2="1160" y2="422"/>

  <!-- evidence badges -->
  <g class="s">
    <text class="band" x="40" y="452">CHECKED BY CODE</text>
    <text class="band" x="1160" y="452" text-anchor="end">PROPOSED BY A MODEL</text>
  </g>
  <g>
    <rect x="40" y="464" width="66" height="24" fill="#ffffff" stroke="#14211f"/>
    <text class="s badge" x="52" y="480" fill="#14211f">Quoted</text>
    <rect x="116" y="464" width="94" height="24" fill="#0b6e6a" stroke="#0b6e6a"/>
    <text class="s badge" x="128" y="480" fill="#ffffff">Recomputed</text>
    <rect x="220" y="464" width="68" height="24" fill="#14211f" stroke="#14211f"/>
    <text class="s badge" x="232" y="480" fill="#ffffff">Differs</text>
    <rect x="298" y="464" width="122" height="24" fill="#fbf4e4" stroke="#8a6a12"/>
    <text class="s badge" x="310" y="480" fill="#8a6a12">Not confirmable</text>
    <rect x="1026" y="464" width="134" height="24" fill="#eef1f2" stroke="#4f6270" stroke-dasharray="4 3"/>
    <text class="s badge" x="1038" y="480" fill="#4f6270">AI interpretation</text>
  </g>
</svg>
