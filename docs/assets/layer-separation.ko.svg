<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="layersTitle layersDesc">
  <title id="layersTitle">층위 분리: 모델이 제안하고, 사람이 승인하고, 고정된 코드가 판정하며, 화면의 모든 문장에는 그 문장을 보증한 층의 배지가 붙는다</title>
  <desc id="layersDesc">네 층위가 왼쪽에서 오른쪽으로 이어집니다. 시작은 공식 발표, 공개 시장 데이터, 붙여 넣은 분석 글이고, 끝은 근거가 붙은 화면의 문장입니다. 1층 해석: 모델이 발표의 사실과 그 원문 구간을 제안하고, 붙여 넣은 글에서 확인할 주장을 골라냅니다. 계산은 하지 않습니다. 2층 승인: 사람이 실행 전에 무엇을 볼지 정하고, 브리프에 담을 결론을 채택합니다. 승인은 결과를 고치지 못합니다. 3층 판정: 고정된 코드가 모든 인용을 원문 바이트와 대조하고 모든 숫자를 공개 데이터로 다시 계산하며, 데이터가 없으면 추측하지 않고 없다고 말합니다. 4층 증거: 모든 문장은 원문 구간이나 원본 행·계산식·정의까지 열리고, 공유 링크는 쓰인 스냅숏을 고정합니다. 층위 아래에는 근거 배지 다섯 가지가 있습니다. 원문 인용, 계산 확인, 불일치, 확인 불가는 코드가 확인하고, AI 해석은 모델의 제안입니다.</desc>
  <!--
    Hand-authored README figure. The English and Korean files share one geometry;
    each language brings its own line breaks and chip widths.
    WeaveTrail design system, pinned at design-reference@d780236766c1e0fddcc1976c252aba35b3898fe4
    Literal hex, because CSS custom properties do not resolve inside a standalone SVG.
    #f7faf9 paper-1 | #ffffff paper-0 | #f0f5f4 surface-sunken
    #0c1513 ink-900 | #14211f ink-800 authorship-code | #263230 ink-700 | #566461 ink-500
    #0b6e6a teal-700 authorship-human | #e6f2f1 teal-tint
    #4f6270 authorship-ai state-review | #eef1f2 slate-tint
    #8a6a12 result-inconclusive | #fbf4e4 amber-tint
    #d0d7de ledger-rule
  -->
  <defs>
    <style>
      .s{font-family:"IBM Plex Sans","IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",Helvetica,Arial,sans-serif}
      .m{font-family:"JetBrains Mono","IBM Plex Mono","IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",ui-monospace,SFMono-Regular,Consolas,monospace}
      .eyebrow{font-size:11px;font-weight:600;letter-spacing:.08em;fill:#0b6e6a}
      .title{font-size:28px;font-weight:600;fill:#0c1513;letter-spacing:-.01em}
      .sub{font-size:14px;fill:#566461}
      .stage{font-size:18px;font-weight:600;fill:#0c1513}
      .body{font-size:13px;fill:#263230}
      .foot{font-size:11px;fill:#566461}
      .chip{font-size:10px;font-weight:600;letter-spacing:.06em}
      .badge{font-size:12px;font-weight:600}
      .band{font-size:11px;font-weight:600;letter-spacing:.08em;fill:#566461}
      .ctx{font-size:11px;fill:#7d8b88}
      .rule{stroke:#d0d7de;stroke-width:1}
    </style>
  </defs>

  <rect width="1200" height="520" fill="#f7faf9"/>
  <rect width="1200" height="4" fill="#0b6e6a"/>
  <rect x=".5" y=".5" width="1199" height="519" fill="none" stroke="#d0d7de"/>

  <g class="s">
    <text class="eyebrow" x="40" y="48">층위 분리</text>
    <text class="title" x="40" y="84">AI가 제안하고, 사람이 승인하고, 코드가 판정합니다.</text>
    <text class="sub" x="40" y="112">점선 회색은 모델 출력이고, 신뢰하지 않습니다. 청록은 사람의 결정, 먹색은 고정된 코드입니다.</text>
    <text class="sub" x="40" y="132">한 층이 두 권한을 갖지 않고, 화면의 모든 문장에는 그 문장을 보증한 층의 배지가 붙습니다.</text>
  </g>
  <line class="rule" x1="40" y1="150" x2="1160" y2="150"/>

  <g class="s">
    <text class="ctx" x="40" y="176">들어오는 것 · 공식 발표, 공개 시장 데이터, 붙여 넣은 분석 글</text>
    <text class="ctx" x="1160" y="176" text-anchor="end">나가는 것 · 근거가 붙은 화면의 문장</text>
  </g>

  <!-- stage 1 -->
  <rect x="40" y="192" width="262" height="200" fill="#eef1f2" stroke="#4f6270" stroke-dasharray="4 3"/>
  <rect x="56" y="208" width="64" height="18" fill="#ffffff" stroke="#4f6270" stroke-dasharray="4 3"/>
  <text class="s chip" x="64" y="221" fill="#4f6270">AI가 제안</text>
  <g class="s">
    <text class="stage" x="56" y="256">L1 · 해석</text>
    <text class="body" x="56" y="284">모델이 발표의 사실과 그 원문 구간을</text>
    <text class="body" x="56" y="304">제안하고, 붙여 넣은 글에서 확인할</text>
    <text class="body" x="56" y="324">주장을 골라냅니다.</text>
    <text class="foot" x="56" y="374">계산하지 않음</text>
  </g>

  <!-- stage 2 -->
  <rect x="326" y="192" width="262" height="200" fill="#e6f2f1" stroke="#0b6e6a"/>
  <rect x="342" y="208" width="72" height="18" fill="#ffffff" stroke="#0b6e6a"/>
  <text class="s chip" x="350" y="221" fill="#0b6e6a">사람이 승인</text>
  <g class="s">
    <text class="stage" x="342" y="256">L2 · 승인</text>
    <text class="body" x="342" y="284">사람이 실행 전에 무엇을 볼지</text>
    <text class="body" x="342" y="304">정하고, 브리프에 담을 결론을</text>
    <text class="body" x="342" y="324">채택합니다.</text>
    <text class="foot" x="342" y="374">결과를 고치지 못함</text>
  </g>

  <!-- stage 3 -->
  <rect x="612" y="192" width="262" height="200" fill="#ffffff" stroke="#14211f"/>
  <rect x="628" y="208" width="72" height="18" fill="#f0f5f4" stroke="#14211f"/>
  <text class="s chip" x="636" y="221" fill="#14211f">코드가 판정</text>
  <g class="s">
    <text class="stage" x="628" y="256">L3 · 판정</text>
    <text class="body" x="628" y="284">고정된 코드가 모든 인용을</text>
    <text class="body" x="628" y="304">원문 바이트와 대조하고, 모든</text>
    <text class="body" x="628" y="324">숫자를 공개 데이터로 다시</text>
    <text class="body" x="628" y="344">계산합니다.</text>
    <text class="foot" x="628" y="374">데이터가 없으면 추측하지 않음</text>
  </g>

  <!-- stage 4 -->
  <rect x="898" y="192" width="262" height="200" fill="#ffffff" stroke="#14211f"/>
  <rect x="914" y="208" width="72" height="18" fill="#f0f5f4" stroke="#14211f"/>
  <text class="s chip" x="922" y="221" fill="#14211f">코드가 기록</text>
  <g class="s">
    <text class="stage" x="914" y="256">L4 · 증거</text>
    <text class="body" x="914" y="284">모든 문장은 원문 구간이나</text>
    <text class="body" x="914" y="304">원본 행·계산식·정의까지 열리고,</text>
    <text class="body" x="914" y="324">링크는 쓰인 스냅숏을 고정합니다.</text>
    <text class="foot" x="914" y="374">문장 → 원문·원본 행</text>
  </g>

  <g fill="#0b6e6a">
    <path d="M306 286l10 6-10 6z"/>
    <path d="M592 286l10 6-10 6z"/>
    <path d="M878 286l10 6-10 6z"/>
  </g>

  <line class="rule" x1="40" y1="422" x2="1160" y2="422"/>

  <!-- evidence badges -->
  <g class="s">
    <text class="band" x="40" y="452">코드가 확인</text>
    <text class="band" x="1160" y="452" text-anchor="end">모델의 제안</text>
  </g>
  <g>
    <rect x="40" y="464" width="70" height="24" fill="#ffffff" stroke="#14211f"/>
    <text class="s badge" x="52" y="480" fill="#14211f">원문 인용</text>
    <rect x="120" y="464" width="70" height="24" fill="#0b6e6a" stroke="#0b6e6a"/>
    <text class="s badge" x="132" y="480" fill="#ffffff">계산 확인</text>
    <rect x="200" y="464" width="56" height="24" fill="#14211f" stroke="#14211f"/>
    <text class="s badge" x="212" y="480" fill="#ffffff">불일치</text>
    <rect x="266" y="464" width="70" height="24" fill="#fbf4e4" stroke="#8a6a12"/>
    <text class="s badge" x="278" y="480" fill="#8a6a12">확인 불가</text>
    <rect x="1098" y="464" width="62" height="24" fill="#eef1f2" stroke="#4f6270" stroke-dasharray="4 3"/>
    <text class="s badge" x="1110" y="480" fill="#4f6270">AI 해석</text>
  </g>
</svg>
