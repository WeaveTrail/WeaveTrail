<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">WeaveTrail system overview</title>
  <desc id="desc">Heterogeneous CSV and JSON events pass through constrained AI mapping and human approval before deterministic replay produces a traceable evidence bundle.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#071b1c"/>
      <stop offset="1" stop-color="#102927"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#5ee6c4"/>
      <stop offset="1" stop-color="#d5f26b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="9" stdDeviation="12" flood-color="#000" flood-opacity=".25"/>
    </filter>
    <style>
      .label{font:700 18px ui-sans-serif,system-ui,sans-serif;fill:#f4f8f1}.small{font:500 14px ui-sans-serif,system-ui,sans-serif;fill:#a9beb8}.step{font:800 12px ui-monospace,SFMono-Regular,monospace;letter-spacing:1.5px;fill:#071b1c}.mono{font:600 13px ui-monospace,SFMono-Regular,monospace;fill:#d5f26b}
    </style>
  </defs>
  <rect width="1200" height="520" rx="28" fill="url(#bg)"/>
  <path d="M100 170 C260 70 400 265 565 150 S895 80 1090 175" fill="none" stroke="#224943" stroke-width="2" stroke-dasharray="7 10"/>
  <path d="M100 355 C270 455 435 280 610 390 S920 455 1090 340" fill="none" stroke="#224943" stroke-width="2" stroke-dasharray="7 10"/>
  <g filter="url(#shadow)">
    <rect x="50" y="155" width="200" height="210" rx="20" fill="#102e2c" stroke="#2d5650"/>
    <rect x="285" y="155" width="200" height="210" rx="20" fill="#102e2c" stroke="#2d5650"/>
    <rect x="520" y="155" width="200" height="210" rx="20" fill="#102e2c" stroke="#2d5650"/>
    <rect x="755" y="155" width="200" height="210" rx="20" fill="#102e2c" stroke="#2d5650"/>
    <rect x="990" y="155" width="160" height="210" rx="20" fill="#102e2c" stroke="#2d5650"/>
  </g>
  <g>
    <rect x="74" y="178" width="58" height="26" rx="13" fill="url(#accent)"/><text x="103" y="196" text-anchor="middle" class="step">INPUT</text>
    <text x="74" y="239" class="label">Mixed events</text><text x="74" y="271" class="small">CSV · JSON</text><text x="74" y="298" class="small">schema · time · order</text><text x="74" y="330" class="mono">rawRowHash</text>
    <rect x="309" y="178" width="58" height="26" rx="13" fill="url(#accent)"/><text x="338" y="196" text-anchor="middle" class="step">AI</text>
    <text x="309" y="239" class="label">Propose</text><text x="309" y="271" class="small">allowed mappings</text><text x="309" y="298" class="small">bounded case scope</text><text x="309" y="330" class="mono">untrusted</text>
    <rect x="544" y="178" width="72" height="26" rx="13" fill="url(#accent)"/><text x="580" y="196" text-anchor="middle" class="step">GATE</text>
    <text x="544" y="239" class="label">Review</text><text x="544" y="271" class="small">validate contract</text><text x="544" y="298" class="small">approve or abstain</text><text x="544" y="330" class="mono">fail closed</text>
    <rect x="779" y="178" width="80" height="26" rx="13" fill="url(#accent)"/><text x="819" y="196" text-anchor="middle" class="step">REPLAY</text>
    <text x="779" y="239" class="label">Calculate</text><text x="779" y="271" class="small">order · dedupe</text><text x="779" y="298" class="small">rules · sensitivity</text><text x="779" y="330" class="mono">deterministic</text>
    <rect x="1014" y="178" width="78" height="26" rx="13" fill="url(#accent)"/><text x="1053" y="196" text-anchor="middle" class="step">PROOF</text>
    <text x="1014" y="239" class="label">Trace</text><text x="1014" y="271" class="small">findings</text><text x="1014" y="298" class="small">versions</text><text x="1014" y="330" class="mono">result hash</text>
  </g>
  <g fill="none" stroke="#5ee6c4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M255 260h20l-8-8m8 8-8 8"/><path d="M490 260h20l-8-8m8 8-8 8"/><path d="M725 260h20l-8-8m8 8-8 8"/><path d="M960 260h20l-8-8m8 8-8 8"/>
  </g>
  <text x="600" y="455" text-anchor="middle" class="small">AI interprets uncertainty. Versioned code owns the result.</text>
</svg>
