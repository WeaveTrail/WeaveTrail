<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 592" role="img" aria-labelledby="caseTitle caseDesc">
  <title id="caseTitle">One day, re-derived from the published record</title>
  <desc id="caseDesc">Three panels. The left panel draws 2026-09-03 for the KOSPI 200 as the session minute by minute, the same line the site shows, marked at its high and its low with the published open and close beneath it, and under that its front-month future as the day's published high-to-low range. Both closed below their own open while finishing above the previous day. The drawn line is illustrative and takes no part in any check. Before anything runs, a person fixes the day examined, the period it is compared against, and the thresholds each check is measured against. The versioned rule then returns a reversal multiple of 13.9147 for the index against a threshold of 10, 25.4705 for the future against 20, and the day standing 1 of 45 trading days in that period. A standing is a position inside the chosen period, not a probability. Each observed value opens onto the published row it was read from, the thresholds were chosen by a person who had already seen the day, and this figure is deterministic output rather than an approved case.</desc>
