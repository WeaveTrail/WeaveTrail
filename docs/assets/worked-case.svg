  <g class="s">
    <text class="panelLabel" x="850" y="174">WHAT THE VERSIONED RULE RETURNED</text>
    <text class="who" x="850" y="194">NOT A MODEL</text>

    <text class="big" x="850" y="240">13.9147×</text>
    <text class="key" x="850" y="260">the index gave back that much of its net move,</text>
    <text class="key" x="850" y="277">inside the same day</text>
    <text class="gate" x="850" y="297">threshold 10× · met</text>

    <text class="big" x="850" y="328">25.4705×</text>
    <text class="key" x="850" y="348">the front-month future on it did the same</text>
    <text class="gate" x="850" y="368">threshold 20× · met</text>

    <text class="big" x="850" y="404">1 of 45</text>
    <text class="key" x="850" y="424">trading days in the period compared</text>
