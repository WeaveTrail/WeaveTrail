<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" role="img" aria-labelledby="caseTitle caseDesc">
  <title id="caseTitle">공개된 기록만으로 하루를 다시 계산한 사례</title>
  <desc id="caseDesc">세 부분으로 나뉜 그림입니다. 왼쪽은 2026-09-03 코스피 200 지수와 그 최근월 선물의 발행된 하루 가격 범위로, 두 시장 모두 전일보다 높게 끝났지만 시가보다 낮게 마감했습니다. 가운데는 실행 전에 사람이 확정하는 것으로, 분석 대상일과 비교할 기준선 기간, 그리고 각 판단이 견주는 기준값입니다. 이어서 버전이 고정된 규칙이 지수의 되돌림 배수 13.9147을 기준값 10에 대해, 선물의 25.4705을 기준값 20에 대해 돌려주고, 그날은 그 기간 45거래일 가운데 1번째였습니다. 순위는 선언된 기간 안에서의 위치일 뿐 확률이 아닙니다. 관측값은 그 값을 읽어 온 공개 원본 행까지 열어 볼 수 있고, 기준값은 이 날의 값을 이미 본 사람이 정했으며, 이 그림은 승인된 사례가 아니라 결정론적 출력입니다.</desc>
