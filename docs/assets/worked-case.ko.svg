<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 492" role="img" aria-labelledby="workedCaseKoTitle workedCaseKoDesc">
  <title id="workedCaseKoTitle">공개된 기록만으로 하루를 다시 계산한 사례</title>
  <desc id="workedCaseKoDesc">세 부분으로 나뉜 그림입니다. 왼쪽은 2026년 9월 3일 코스피 200 지수와 그 최근월 선물의 발행된 하루 가격 범위로, 두 시장 모두 전일보다 높게 끝났지만 시가보다 낮게 마감했습니다. 가운데는 실행 전에 사람이 확정하는 항목으로 분석 대상일, 비교할 기준선 기간, 되돌림을 얼마나 크게 볼지, 몇 개 시장이 같은 모양이어야 하는지입니다. 오른쪽은 고정된 코드가 내놓은 값으로, 지수는 전일 대비 변화폭의 약 14배, 선물은 약 25배를 같은 날 안에서 되돌렸고 그날은 비교한 기준선 45거래일 가운데 1번째였습니다. 순위는 선언된 기간 안에서의 위치일 뿐 확률이 아닙니다. 관측값은 그 값을 읽어 온 공개 원본 행까지 열어 볼 수 있고, 기준값은 사람이 정한 것이며, 순위는 승인된 기간 전체를 가로질러 계산합니다.</desc>
  <!--
    WeaveTrail design system, pinned at design-reference@3f078da1970e8accd83fbdde73308a2a24d0d1f8
    Literal hex, because CSS custom properties do not resolve inside a standalone SVG.
    #f7faf9 paper-1 | #ffffff paper-0 | #0c1513 ink-900 | #263230 ink-700
    #566461 ink-500 | #7d8b88 ink-400 | #0b6e6a teal-700
    #d0d7de ledger-rule | #a9bebc ledger-rule-strong
  -->
  <defs>
    <style>
      .s{font-family:"IBM Plex Sans KR","IBM Plex Sans","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif}
      .m{font-family:"JetBrains Mono","IBM Plex Mono",ui-monospace,SFMono-Regular,Consolas,monospace}
      .eyebrow{font-size:11px;font-weight:600;letter-spacing:.08em;fill:#0b6e6a}
      .title{font-size:27px;font-weight:600;fill:#0c1513;letter-spacing:-.01em}
      .sub{font-size:14px;fill:#566461}
      .panelLabel{font-size:11px;font-weight:600;letter-spacing:.06em;fill:#566461}
      .who{font-size:11px;font-weight:600;letter-spacing:.06em;fill:#7d8b88}
      .leg{font-size:13px;font-weight:600;fill:#263230}
      .key{font-size:12px;fill:#566461}
      .val{font-size:13px;fill:#263230}
      .big{font-size:20px;font-weight:600;fill:#0c1513}
      .note{font-size:12px;fill:#566461}
      .foot{font-size:11px;fill:#7d8b88}
      .rule{stroke:#d0d7de;stroke-width:1}
    </style>
  </defs>

  <rect width="1200" height="492" fill="#f7faf9"/>
  <rect width="1200" height="4" fill="#0b6e6a"/>
  <rect x=".5" y=".5" width="1199" height="491" fill="none" stroke="#d0d7de"/>

  <g class="s">
    <text class="eyebrow" x="40" y="48">실제 사례</text>
    <text class="title" x="40" y="84">공개된 기록만으로 하루를 다시 계산합니다.</text>
    <text class="sub" x="40" y="112">2026년 9월 3일. 두 시장 모두 전일보다 높게 끝났고, 두 시장 모두 시가보다 낮게 마감했습니다.</text>
  </g>
  <line class="rule" x1="40" y1="140" x2="1160" y2="140"/>

  <!-- panel 1 : the published day -->
  <g class="s">
    <text class="panelLabel" x="40" y="174">발행처가 공개한 그날의 값</text>
    <text class="who" x="40" y="194">막대는 그날의 가격 범위이며, 하루의 흐름이 아닙니다</text>

    <text class="leg" x="40" y="222">코스피 200 지수</text>
    <text class="key" x="231" y="240" text-anchor="middle">종가</text>
    <text class="key" x="342" y="240" text-anchor="middle">시가</text>
    <line x1="40" y1="256" x2="380" y2="256" stroke="#a9bebc" stroke-width="6" stroke-linecap="round"/>
    <line x1="41" y1="246" x2="41" y2="266" stroke="#7d8b88" stroke-width="2"/>
    <line x1="379" y1="246" x2="379" y2="266" stroke="#7d8b88" stroke-width="2"/>
    <circle cx="342" cy="256" r="6" fill="#7d8b88"/>
    <circle cx="231" cy="256" r="6" fill="#0b6e6a"/>
    <text class="key" x="40" y="280">저가</text>
    <text class="val m" x="40" y="297">1,009.70</text>
    <text class="key" x="380" y="280" text-anchor="end">고가</text>
    <text class="val m" x="380" y="297" text-anchor="end">1,050.77</text>

    <text class="leg" x="40" y="341">코스피200 선물 · 최근월물</text>
    <text class="key" x="209" y="365" text-anchor="middle">종가</text>
    <text class="key" x="322" y="365" text-anchor="middle">시가</text>
    <line x1="40" y1="381" x2="380" y2="381" stroke="#a9bebc" stroke-width="6" stroke-linecap="round"/>
    <line x1="41" y1="371" x2="41" y2="391" stroke="#7d8b88" stroke-width="2"/>
    <line x1="379" y1="371" x2="379" y2="391" stroke="#7d8b88" stroke-width="2"/>
    <circle cx="322" cy="381" r="6" fill="#7d8b88"/>
    <circle cx="209" cy="381" r="6" fill="#0b6e6a"/>
    <text class="key" x="40" y="405">저가</text>
    <text class="val m" x="40" y="422">1,008.70</text>
    <text class="key" x="380" y="405" text-anchor="end">고가</text>
    <text class="val m" x="380" y="422" text-anchor="end">1,051.65</text>
  </g>

  <line class="rule" x1="430" y1="162" x2="430" y2="434"/>

  <!-- panel 2 : what a person fixes first -->
  <g class="s">
    <text class="panelLabel" x="470" y="174">실행 전에 확정하는 것</text>
    <text class="who" x="470" y="194">사람이 정합니다</text>
    <rect x="470" y="212" width="300" height="152" fill="#ffffff" stroke="#d0d7de"/>
    <text class="val" x="490" y="242">분석 대상일</text>
    <line class="rule" x1="490" y1="258" x2="750" y2="258"/>
    <text class="val" x="490" y="282">비교할 기준선 기간</text>
    <line class="rule" x1="490" y1="298" x2="750" y2="298"/>
    <text class="val" x="490" y="322">되돌림을 얼마나 크게 볼지</text>
    <line class="rule" x1="490" y1="338" x2="750" y2="338"/>
    <text class="val" x="490" y="356">몇 개 시장이 같은 모양이어야 하는지</text>
    <text class="note" x="470" y="394">하나만 넓혀도 결과가 달라지므로,</text>
    <text class="note" x="470" y="412">실행 전에 먼저 확정합니다.</text>
  </g>

  <line class="rule" x1="810" y1="162" x2="810" y2="434"/>

  <!-- panel 3 : what the code returns -->
  <g class="s">
    <text class="panelLabel" x="850" y="174">고정된 코드가 내놓는 값</text>
    <text class="who" x="850" y="194">모델이 아닙니다</text>

    <text class="big" x="850" y="240">약 14배</text>
    <text class="key" x="850" y="260">지수는 전일 대비 변화폭의 그만큼을</text>
    <text class="key" x="850" y="277">같은 날 안에서 되돌렸습니다</text>

    <text class="big" x="850" y="317">약 25배</text>
    <text class="key" x="850" y="337">선물도 같은 모양이었습니다</text>

    <text class="big" x="850" y="377">45거래일 중 1번째</text>
    <text class="key" x="850" y="397">비교한 기준선 기간 안에서의 순위</text>

    <text class="note" x="850" y="422">선언된 기간 안에서의 순위일 뿐, 확률이 아닙니다.</text>
  </g>

  <line class="rule" x1="40" y1="434" x2="1160" y2="434"/>
  <text class="foot s" x="40" y="454">발행처 값: 금융위원회 공개 데이터. 저장소에는 fsc-kospi-200-baseline-20260701-20260903, fsc-kospi-200-futures-20260903으로 커밋되어 있습니다.</text>
  <text class="foot s" x="40" y="472">관측값은 그 값을 읽어 온 공개 원본 행까지 열어 볼 수 있습니다. 배수와 순위는 승인된 범위 안에서의 규칙 출력일 뿐, 누군가에 대한 판단이 아닙니다.</text>
</svg>
